# Start with:  make jenkins-up      Then open:  http://localhost:8090
services:
  jenkins:
    build: .
    image: miko-jenkins:local
    container_name: miko-jenkins
    ports:
      - "8090:8080"   # 8080 and 8081 are used by the insurance project (Kafka UI, Airflow)
    volumes:
      - jenkins_home:/var/jenkins_home   # jobs, history and caches survive a restart
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx768m   # Jenkins itself: max 768 MB, leaves room for Spark in the tests
    mem_limit: 3g            # if a build needs more, only the build fails; WSL does not freeze

volumes:
  jenkins_home:
