[project]
name = "miko"
version = "0.1.0"
description = "Miko: nowcasting a dairy farm's sustainability indicators from robot data (portfolio project)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ali Baghdadi" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    # Spark 4.0 and Delta 4.0 belong together. delta-spark only says "pyspark>=4.0.0",
    # so without the exact pin pip would install a newer, incompatible PySpark.
    "pyspark==4.0.5",
    "delta-spark==4.0.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.3",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: needs a local Spark session (slower, downloads the Delta jar on first run)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
