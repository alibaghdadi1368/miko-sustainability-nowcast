# Settings for running Miko on your own computer.
# Paths are relative to the project root.
env: local

paths:
  landing: data/landing # raw files arrive here (written by the generator)
  lakehouse: data/lakehouse # Delta tables: bronze, silver, gold
  checkpoints: data/checkpoints # streaming checkpoints

spark:
  driver_memory: 2g # raise to 4g if you have 16 GB RAM or more
  shuffle_partitions: 4 # small data on one laptop: few partitions is faster
