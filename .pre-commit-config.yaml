# Checks that run automatically on every `git commit`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3   # keep equal to the ruff version in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
